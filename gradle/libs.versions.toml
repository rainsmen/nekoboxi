[versions]
room = "2.6.1"
roomigrant = "0.3.4"
work = "2.9.1"
navigation = "2.8.4"
editorkit = "2.6.0"

[libraries]
kotlinx-coroutines-android = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
androidx-core-ktx = "androidx.core:core-ktx:1.13.1"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.3.2"
androidx-activity-ktx = "androidx.activity:activity-ktx:1.10.1"
androidx-fragment-ktx = "androidx.fragment:fragment-ktx:1.8.5"
androidx-browser = "androidx.browser:browser:1.8.0"
androidx-swiperefreshlayout = "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.0"
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-preference-ktx = "androidx.preference:preference-ktx:1.2.1"
androidx-appcompat = "androidx.appcompat:appcompat:1.7.0"
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-multiprocess = { module = "androidx.work:work-multiprocess", version.ref = "work" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

material = "com.google.android.material:material:1.12.0"
gson = "com.google.code.gson:gson:2.9.0" # pinned: SingBoxOptionSerializer getDelegateAdapter hack recurses on 2.11
zxing-lite = "com.github.jenly1314:zxing-lite:2.1.1"
editorkit = { module = "com.blacksquircle.ui:editorkit", version.ref = "editorkit" }
editorkit-language-base = { module = "com.blacksquircle.ui:language-base", version.ref = "editorkit" }
editorkit-language-json = { module = "com.blacksquircle.ui:language-json", version.ref = "editorkit" }
okhttp = "com.squareup.okhttp3:okhttp:4.12.0"
snakeyaml = "org.yaml:snakeyaml:2.2"
material-about-library = "com.github.daniel-stoneuk:material-about-library:3.2.0-rc01"
process-phoenix = "com.jakewharton:process-phoenix:2.1.2"
kryo = "com.esotericsoftware:kryo:5.6.2"
guava = "com.google.guava:guava:33.3.1-android"
ini4j = "org.ini4j:ini4j:0.5.4"
recyclerview-fastscroll = "com.simplecityapps:recyclerview-fastscroll:2.0.1"
roomigrant-lib = { module = "com.github.MatrixDev.Roomigrant:RoomigrantLib", version.ref = "roomigrant" }
roomigrant-compiler = { module = "com.github.MatrixDev.Roomigrant:RoomigrantCompiler", version.ref = "roomigrant" }
desugar-jdk-libs = "com.android.tools:desugar_jdk_libs:2.0.3"
junit = "junit:junit:4.13.2"
