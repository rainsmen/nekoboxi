name: Preview Build
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Source Status
        run: |
          git ls-files -s buildScript 'libcore/*.sh' | sort | sha1sum > golang_status
          git ls-files -s sing-box libneko | sha1sum >> golang_status
          git ls-files -s libcore | sort | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          # Go 1.26+ breaks go-json-experiment used by sing 1.14 (json.SkipFunc).
          go-version: 1.25.x
          cache: false
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: LibCore Config Test
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: libcore
        run: go test -ldflags=-checklinkname=0 -tags with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale -run TestGeneratedConfigShapes .
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar

  build:
    name: Build Preview APK
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download Naive Plugin
        run: bash download_naive.sh
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          # Preview APKs are signed with the old (already public) key only, so they
          # install over existing builds. The new key and lineage stay in release.yml.
          # Without these secrets the preview APK is debug-signed.
          KEYSTORE_BASE64: ${{ secrets.OLD_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.OLD_KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.OLD_ALIAS_NAME }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:testOssDebugUnitTest app:lintOssRelease app:assemblePreviewRelease
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/preview/release/*.apk
