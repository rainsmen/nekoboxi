name: Preview Build
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare Pinned Sources
        run: git submodule update --init --checkout sing-box libneko libcore/gomobile
      - name: Source Status
        run: |
          git ls-files -s buildScript 'libcore/*.sh' | sort | sha1sum > golang_status
          git ls-files -s sing-box libneko | sha1sum >> golang_status
          git ls-files -s libcore | sort | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Go 1.26+ breaks go-json-experiment used by sing 1.14 (json.SkipFunc).
          go-version: 1.25.14
          cache: false
      - name: Validate Workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/preview.yml .github/workflows/release.yml
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: LibCore Tests
        working-directory: libcore
        env:
          GOMAXPROCS: 3
        run: go test -race -ldflags=-checklinkname=0 -tags with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale .
      - name: Upload LibCore
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar

  build:
    name: Build Preview APK
    runs-on: ubuntu-24.04
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare Pinned Sources
        run: git submodule update --init --checkout sing-box libneko libcore/gomobile
      - name: Install Golang
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.14
          cache: false
      - name: Download LibCore
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Download Naive Plugin
        run: bash download_naive.sh
      - name: Check Theme Contrast
        run: python3 buildScript/ui/check_palettes.py
      - name: Install Verification SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"'
      - name: Test Release Verification
        run: python3 -m unittest discover -s buildScript/verify -p 'test_*.py'
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          # A dedicated, unpublished Preview key; never use the compromised old release key.
          KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.PREVIEW_KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.PREVIEW_ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.PREVIEW_ALIAS_PASS }}
          EXPECTED_PREVIEW_CERT_SHA256: ${{ vars.EXPECTED_PREVIEW_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME EXPECTED_PREVIEW_CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "Preview requires dedicated PREVIEW_* signing secrets and certificate pin: missing $name" >&2; exit 1; fi
          done
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:testOssDebugUnitTest app:lintOssRelease app:assemblePreviewRelease
      - name: Start Kotlin-generated configurations in the core
        working-directory: libcore
        env:
          GOMAXPROCS: 3
          THBOX_CONFIG_FIXTURES: ${{ github.workspace }}/app/build/generated/config-fixtures/testOssDebugUnitTest
        run: go test -race -count=1 -ldflags=-checklinkname=0 -tags with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_tailscale -run TestKotlinGeneratedConfigurationStarts .
      - name: Verify Final APK
        env:
          EXPECTED_PREVIEW_CERT_SHA256: ${{ vars.EXPECTED_PREVIEW_CERT_SHA256 }}
        run: |
          python3 buildScript/verify/apk.py app/build/outputs/apk/preview/release/*.apk \
            --package io.github.rainsmen.thbox.preview --certificate "$EXPECTED_PREVIEW_CERT_SHA256" > apk-verification.txt
          cat apk-verification.txt
      - name: Record Build Provenance
        run: |
          {
            git rev-parse HEAD
            git submodule status
            sha256sum app/build/outputs/apk/*/release/*.apk
            cat buildScript/lib/assets.lock
            cat apk-verification.txt
          } > build-evidence.txt
      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-report
          path: app/build/lint.html
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/reports/ui/
            app/build/generated/config-fixtures/
            build-evidence.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: APKs
          if-no-files-found: error
          path: app/build/outputs/apk/preview/release/*.apk
