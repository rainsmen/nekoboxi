name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish: If want ignore"
        required: false
      play:
        description: "Play: If want ignore"
        required: false

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: |
          git ls-files -s buildScript 'libcore/*.sh' | sort | sha1sum > golang_status
          git ls-files -s sing-box | sha1sum >> golang_status
      - name: Libcore Status
        run: git ls-files -s libcore | sort | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: |
          git ls-files -s buildScript 'libcore/*.sh' | sort | sha1sum > golang_status
          git ls-files -s sing-box | sha1sum >> golang_status
      - name: Libcore Status
        run: git ls-files -s libcore | sort | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          bash download_naive.sh
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          NDK_VER=$(ls -d ${ANDROID_HOME}/ndk/28.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -z "$NDK_VER" ] && NDK_VER=$(ls -d ${ANDROID_HOME}/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -z "$NDK_VER" ] && NDK_VER=$(ls -d ${ANDROID_HOME}/ndk/26.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -z "$NDK_VER" ] && NDK_VER="${ANDROID_HOME}/ndk/25.0.8775105"
          echo "ndk.dir=${NDK_VER}" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew app:assembleOssRelease -PVERSION_NAME="${{ github.event.inputs.tag }}"
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'y'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Donwload Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          if gh release view "${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ github.event.inputs.tag }}" apks/*.apk --clobber
          else
            gh release create "${{ github.event.inputs.tag }}" apks/*.apk --title "${{ github.event.inputs.tag }}" --generate-notes
          fi
  play:
    name: Build Play Bundle
    if: github.event.inputs.play == 'true'
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Golang Status
        run: git ls-files -s buildScript 'libcore/*.sh' | sort | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files -s libcore | sort | sha1sum > libcore_status
      - name: LibCore Cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}
      - name: Checkout Library
        run: |
          git submodule update --init 'app/*'
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          NDK_VER=$(ls -d ${ANDROID_HOME}/ndk/28.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -z "$NDK_VER" ] && NDK_VER=$(ls -d ${ANDROID_HOME}/ndk/27.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -z "$NDK_VER" ] && NDK_VER=$(ls -d ${ANDROID_HOME}/ndk/26.* 2>/dev/null | sort -V | tail -n 1 || true)
          [ -z "$NDK_VER" ] && NDK_VER="${ANDROID_HOME}/ndk/25.0.8775105"
          echo "ndk.dir=${NDK_VER}" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew bundlePlayRelease -PVERSION_NAME="${{ github.event.inputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
