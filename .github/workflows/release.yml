name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag"
        required: true
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Source Status
        run: |
          git ls-files -s buildScript 'libcore/*.sh' | sort | sha1sum > golang_status
          git ls-files -s sing-box libneko | sha1sum >> golang_status
          git ls-files -s libcore | sort | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          # Go 1.26+ breaks go-json-experiment used by sing 1.14 (json.SkipFunc).
          go-version: 1.25.x
          cache: false
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar

  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs: libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LibCore
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download Naive Plugin
        run: bash download_naive.sh
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          TAG: ${{ inputs.tag }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          # Gradle signs with the old key; rotate_sign.sh adds the v3 rotation.
          KEYSTORE_BASE64: ${{ secrets.OLD_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.OLD_KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.OLD_ALIAS_NAME }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./run init action gradle
          ./gradlew app:testOssDebugUnitTest app:assembleOssRelease -PVERSION_NAME="$TAG"
      - name: Rotate Signature
        env:
          REQUIRE_ROTATION: "1"
          OLD_KEYSTORE_BASE64: ${{ secrets.OLD_KEYSTORE_BASE64 }}
          OLD_KEYSTORE_PASS: ${{ secrets.OLD_KEYSTORE_PASS }}
          OLD_ALIAS_NAME: ${{ secrets.OLD_ALIAS_NAME }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: bash buildScript/sign/rotate_sign.sh $(find app/build/outputs/apk/oss -name '*.apk')
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: app/build/outputs/apk/oss/release/*.apk

  publish:
    name: Publish Release
    if: inputs.publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: APKs
          path: apks
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apks/*.apk --clobber
          else
            gh release create "$TAG" apks/*.apk --title "$TAG" --generate-notes
          fi
